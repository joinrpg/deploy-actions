apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: __APP_NAME__
  name: __APP_NAME__
spec:
  replicas: 1 # Чтобы сделать две, надо решить вопрос с AspNet Data Protection
  selector:
    matchLabels:
      app.kubernetes.io/name: __APP_NAME__
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __APP_NAME__
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - __APP_NAME__
                topologyKey: kubernetes.io/hostname
              weight: 100
      imagePullSecrets:
        - name: craas-auth # создаёт интеграция кластера Selectel с Container Registry
      containers:
        - name: __APP_NAME__
          envFrom:
            - secretRef:
                name: __APP_NAME__-secret
                optional: false
            - configMapRef:
                name: __APP_NAME__-config
                optional: true
          image: __APP_NAME__
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health/live
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /health/ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 200m
              memory: 128Mi
