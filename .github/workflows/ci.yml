name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  actionlint:
    name: Lint workflows and actions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: docker run -v "${{ github.workspace }}:/repo" --workdir /repo rhysd/actionlint:latest -shellcheck=

  fixtures:
    name: Fixture tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.35.9

      - name: setup-kubectl-context fails with unreachable server
        id: k8s-context
        uses: ./setup-kubectl-context
        continue-on-error: true
        with:
          k8s-url: https://example.invalid
          deploy-sa-secret: '!!!not-base64!!!'

      - name: Assert previous step failed
        run: |
          if [ "${{ steps.k8s-context.outcome }}" != "failure" ]; then
            echo "::error::setup-kubectl-context unexpectedly succeeded with garbage input"
            exit 1
          fi
          echo "setup-kubectl-context failed as expected"

      - name: selectel-cr-login fails with garbage credentials
        id: cr-login
        uses: ./selectel-cr-login
        continue-on-error: true
        with:
          username: definitely-not-a-real-user
          password: definitely-not-a-real-password

      - name: Assert previous step failed
        run: |
          if [ "${{ steps.cr-login.outcome }}" != "failure" ]; then
            echo "::error::selectel-cr-login unexpectedly succeeded with garbage credentials"
            exit 1
          fi
          echo "selectel-cr-login failed as expected"
