name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  actionlint:
    name: Lint workflows and actions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: docker run -v "${{ github.workspace }}:/repo" --workdir /repo rhysd/actionlint:latest -shellcheck=

  fixtures:
    name: Fixture tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.35.9

      - name: setup-kubectl-context action must exist
        run: test -f setup-kubectl-context/action.yml

      - name: setup-kubectl-context fails with unreachable server
        id: k8s-context
        uses: ./setup-kubectl-context
        continue-on-error: true
        with:
          k8s-url: https://example.invalid
          deploy-sa-secret: '!!!not-base64!!!'

      - name: Assert previous step failed
        run: |
          if [ "${{ steps.k8s-context.outcome }}" != "failure" ]; then
            echo "::error::setup-kubectl-context unexpectedly succeeded with garbage input"
            exit 1
          fi
          echo "setup-kubectl-context failed as expected"

      - name: selectel-cr-login action must exist
        run: test -f selectel-cr-login/action.yml

      - name: selectel-cr-login fails with garbage credentials
        id: cr-login
        uses: ./selectel-cr-login
        continue-on-error: true
        with:
          username: definitely-not-a-real-user
          password: definitely-not-a-real-password

      - name: Assert previous step failed
        run: |
          if [ "${{ steps.cr-login.outcome }}" != "failure" ]; then
            echo "::error::selectel-cr-login unexpectedly succeeded with garbage credentials"
            exit 1
          fi
          echo "selectel-cr-login failed as expected"

      - name: resolve-image-digests action must exist
        run: test -f resolve-image-digests/action.yml

      - name: resolve-image-digests resolves public image digest
        id: resolve-digests
        uses: ./resolve-image-digests
        with:
          version: latest
          registry: index.docker.io
          images: |
            busybox=library/busybox
            alpine=library/alpine

      - name: Assert resolved digest output
        run: |
          yaml="${{ steps.resolve-digests.outputs.images-yaml }}"
          echo "$yaml"
          echo "$yaml" | grep -q -- '- name: busybox$'
          echo "$yaml" | grep -q 'newName: index.docker.io/library/busybox'
          echo "$yaml" | grep -q 'newTag: latest@sha256:'
          echo "$yaml" | grep -q -- '^- name: alpine$'
          echo "$yaml" | grep -q 'newName: index.docker.io/library/alpine'

      - name: render-deploy-manifests action must exist
        run: test -f render-deploy-manifests/action.yml

      - name: render-deploy-manifests builds overlay from secrets and images
        uses: ./render-deploy-manifests
        with:
          overlay-path: tests/fixtures/overlays/test
          secret-name: bastilia-rating-secret
          secrets-json: '{"KUBESECRET_FROM_ACTION":"action-value","OTHER_SECRET":"must-not-appear"}'
          images-yaml: |
            - name: bastilia-rating
              newName: cr.selcloud.ru/joinrpg/bastilia-rating
              newTag: 1.0.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Assert env file contents
        run: |
          cat tests/fixtures/overlays/test/bastilia-rating-secret.env
          grep -q '^FROM_ACTION=action-value$' tests/fixtures/overlays/test/bastilia-rating-secret.env
          ! grep -q 'OTHER_SECRET\|must-not-appear' tests/fixtures/overlays/test/bastilia-rating-secret.env

      - name: Assert rendered manifests
        run: |
          ls kustomize_output
          grep -rq 'cr.selcloud.ru/joinrpg/bastilia-rating:1.0.0@sha256:aaaa' kustomize_output
          grep -rq 'YWN0aW9uLXZhbHVl' kustomize_output

      - name: render-deploy-manifests rejects multiline secrets
        run: git checkout -- tests/fixtures/overlays/test/kustomization.yaml

      - name: Run multiline fixture (must fail)
        id: render-multiline
        uses: ./render-deploy-manifests
        continue-on-error: true
        with:
          overlay-path: tests/fixtures/overlays/test
          secret-name: bastilia-rating-secret
          secrets-json: '{"KUBESECRET_PEM":"line1\nline2"}'
          images-yaml: '- name: x'

      - name: Assert multiline rejection
        run: |
          if [ "${{ steps.render-multiline.outcome }}" != "failure" ]; then
            echo "::error::render-deploy-manifests did not reject a multiline secret"
            exit 1
          fi

      - name: render-deploy-manifests rejects duplicate images key
        run: |
          git checkout -- tests/fixtures/overlays/test/kustomization.yaml
          overlay=/tmp/overlay-dup
          rm -rf "$overlay"
          cp -r tests/fixtures/overlays/test "$overlay"
          echo 'images:' >> "$overlay/kustomization.yaml"

      - name: Run duplicate-images fixture (must fail)
        id: render-dup
        uses: ./render-deploy-manifests
        continue-on-error: true
        with:
          overlay-path: /tmp/overlay-dup
          secret-name: bastilia-rating-secret
          secrets-json: '{"KUBESECRET_A":"b"}'
          images-yaml: '- name: x'

      - name: Assert duplicate images rejection
        run: |
          if [ "${{ steps.render-dup.outcome }}" != "failure" ]; then
            echo "::error::render-deploy-manifests did not reject duplicate images: key"
            exit 1
          fi

      - name: render-deploy-manifests rejects duplicate secretGenerator
        run: |
          git checkout -- tests/fixtures/overlays/test/kustomization.yaml
          overlay=/tmp/overlay-dup-secret
          rm -rf "$overlay"
          cp -r tests/fixtures/overlays/test "$overlay"
          printf '\nsecretGenerator:\n- name: bastilia-rating-secret\n  envs:\n  - some.env\n' >> "$overlay/kustomization.yaml"

      - name: Run duplicate-secretGenerator fixture (must fail)
        id: render-dup-secret
        uses: ./render-deploy-manifests
        continue-on-error: true
        with:
          overlay-path: /tmp/overlay-dup-secret
          secret-name: bastilia-rating-secret
          secrets-json: '{"KUBESECRET_A":"b"}'
          images-yaml: '- name: x'

      - name: Assert duplicate secretGenerator rejection
        run: |
          if [ "${{ steps.render-dup-secret.outcome }}" != "failure" ]; then
            echo "::error::render-deploy-manifests did not reject duplicate secretGenerator"
            exit 1
          fi
          git checkout -- tests/fixtures/overlays/test/kustomization.yaml 2>/dev/null || true

      - name: apply-with-prune action must exist
        run: test -f apply-with-prune/action.yml

      - name: Point kubectl at unreachable API server
        run: |
          cat > /tmp/fake-kubeconfig <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://example.invalid
            name: fake
          contexts:
          - context:
              cluster: fake
              user: fake
            name: fake
          current-context: fake
          users:
          - name: fake
            user: {}
          EOF
          echo "KUBECONFIG=/tmp/fake-kubeconfig" >> "$GITHUB_ENV"

      - name: apply-with-prune fails against unreachable cluster
        id: apply-prune
        uses: ./apply-with-prune
        continue-on-error: true
        with:
          namespace: fixture-ns
          prune-selector: managed-by-kustomize=true
          manifests-dir: kustomize_output
          rollout-deployments: bastilia-rating

      - name: Assert previous step failed
        run: |
          if [ "${{ steps.apply-prune.outcome }}" != "failure" ]; then
            echo "::error::apply-with-prune unexpectedly succeeded with unreachable cluster"
            exit 1
          fi
          echo "apply-with-prune failed as expected"

      - name: calculate-version action must exist
        run: test -f calculate-version/action.yml

      - name: calculate-version returns semver for release tag
        id: calc-version
        uses: ./calculate-version
        with:
          ref-name: v1.0.0
          ref-type: tag

      - name: Assert calculated version
        run: |
          version="${{ steps.calc-version.outputs.version }}"
          echo "version=$version"
          test "$version" = "1.0.0"
          test "${{ steps.calc-version.outputs.is-release }}" = "True"

      - name: publish-dotnet-containers action must exist
        run: test -f publish-dotnet-containers/action.yml

      - name: Stub dotnet and docker to capture invocations
        run: |
          mkdir -p /tmp/stubs
          printf '#!/bin/sh\necho "dotnet $*" >> /tmp/stubs/calls.log\nexit 0\n' > /tmp/stubs/dotnet
          printf '#!/bin/sh\necho "docker $*" >> /tmp/stubs/calls.log\nif [ "$1" = "login" ]; then cat >> /tmp/stubs/stdin.log 2>/dev/null || true; fi\ncase "$*" in\n  *example.invalid*) exit 1 ;;\nesac\nexit 0\n' > /tmp/stubs/docker
          chmod +x /tmp/stubs/dotnet /tmp/stubs/docker
          echo "/tmp/stubs" >> "$GITHUB_PATH"
          touch /tmp/stubs/calls.log /tmp/stubs/stdin.log

      - name: publish-dotnet-containers expands names and tags (stubbed tools)
        uses: ./publish-dotnet-containers
        with:
          projects: |
            fixture-app=./src/Fixture.App/Fixture.App.csproj
            fixture-app-migrator=./src/Fixture.App.Migrator/Fixture.App.Migrator.csproj
          version: 1.2.3
          push-latest: 'false'

      - name: Assert docker invocations used expanded names
        run: |
          cat /tmp/stubs/calls.log
          # Регрессия: одинарные кавычки гасили раскрытие переменных и docker получал
          # буквальный текст вида cr.selcloud.ru/${image_name}:${tag}.
          ! grep -qF '${image_name}' /tmp/stubs/calls.log
          ! grep -qF '${tag}' /tmp/stubs/calls.log
          grep -q 'docker tag fixture-app:1.2.3 cr.selcloud.ru/fixture-app:1.2.3' /tmp/stubs/calls.log
          grep -q 'docker push --quiet cr.selcloud.ru/fixture-app-migrator:1.2.3' /tmp/stubs/calls.log

      - name: resolve-image-digests login passes password via env, not interpolation
        uses: ./resolve-image-digests
        continue-on-error: true
        id: resolve-login
        with:
          version: latest
          registry: example.invalid
          cr-username: fixture-user
          cr-password: "pa'ss\\word"
          images: fixture-app=library/busybox

      - name: Assert login step parsed the quoted password
        run: |
          # Старая версия интерполировала пароль внутрь single-quoted строки —
          # кавычка в пароле давала syntax error уже на парсинге bash.
          # Ожидаем: шаг дошёл до docker login и упал на нём (stub падает на
          # example.invalid), а не на синтаксисе.
          if [ "${{ steps.resolve-login.outcome }}" != "failure" ]; then
            echo "::error::resolve-image-digests login step did not run/fail as expected"
            exit 1
          fi
          # docker login был вызван с правильными аргументами
          grep -q 'docker login example.invalid -u fixture-user --password-stdin' /tmp/stubs/calls.log
          # пароль доехал до stdin целиком, без обрезки по кавычке
          grep -q "pa'ss.word" /tmp/stubs/stdin.log

      - name: run-db-migrations action must exist
        run: test -f run-db-migrations/action.yml && test -f run-db-migrations/wait-migration.ps1

      - name: wait-migration.ps1 parses and is parameterized
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "run-db-migrations/wait-migration.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $content = Get-Content run-db-migrations/wait-migration.ps1 -Raw
          if ($content -match 'joinrpg-dal-migrate') {
            Write-Error 'hardcoded job name joinrpg-dal-migrate found (must be parameterized)'
            exit 1
          }
          if ($content -notmatch 'MIGRATION_JOB_NAME') {
            Write-Error 'MIGRATION_JOB_NAME is not used'
            exit 1
          }
          Write-Output "wait-migration.ps1 parses, parameterized"

      - name: templates/base skeleton must exist
        run: |
          test -f templates/base/kustomization.yaml
          test -f templates/base/deployment.yaml
          test -f templates/base/service.yaml
          test -f templates/base/httproute.yaml
          test -f templates/base/pdp.yaml
          test -f templates/base/migration-job.yaml
          test -f templates/base/__APP_NAME__-secret.env
          ! grep -rq -- '- name: bastilia-rating' templates/base

      - name: templates/base renders after placeholder substitution
        run: |
          rm -rf /tmp/tpl /tmp/tpl-render
          cp -r templates/base /tmp/tpl
          cd /tmp/tpl
          mv __APP_NAME__-secret.env fixture-app-secret.env
          sed -i 's/__APP_NAME__/fixture-app/g' *.yaml
          kubectl kustomize . -o /tmp/tpl-render
          grep -q 'managed-by-kustomize: "true"' /tmp/tpl-render
          grep -q 'name: fixture-app$' /tmp/tpl-render
          grep -q 'name: fixture-app-secret-' /tmp/tpl-render
          grep -q 'name: fixture-app-migrator$' /tmp/tpl-render
