name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  actionlint:
    name: Lint workflows and actions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: docker run -v "${{ github.workspace }}:/repo" --workdir /repo rhysd/actionlint:latest -shellcheck=

  fixtures:
    name: Fixture tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.35.9

      - name: setup-kubectl-context action must exist
        run: test -f setup-kubectl-context/action.yml

      - name: setup-kubectl-context fails with unreachable server
        id: k8s-context
        uses: ./setup-kubectl-context
        continue-on-error: true
        with:
          k8s-url: https://example.invalid
          deploy-sa-secret: '!!!not-base64!!!'

      - name: Assert previous step failed
        run: |
          if [ "${{ steps.k8s-context.outcome }}" != "failure" ]; then
            echo "::error::setup-kubectl-context unexpectedly succeeded with garbage input"
            exit 1
          fi
          echo "setup-kubectl-context failed as expected"

      - name: selectel-cr-login action must exist
        run: test -f selectel-cr-login/action.yml

      - name: selectel-cr-login fails with garbage credentials
        id: cr-login
        uses: ./selectel-cr-login
        continue-on-error: true
        with:
          username: definitely-not-a-real-user
          password: definitely-not-a-real-password

      - name: Assert previous step failed
        run: |
          if [ "${{ steps.cr-login.outcome }}" != "failure" ]; then
            echo "::error::selectel-cr-login unexpectedly succeeded with garbage credentials"
            exit 1
          fi
          echo "selectel-cr-login failed as expected"

      - name: resolve-image-digests action must exist
        run: test -f resolve-image-digests/action.yml

      - name: resolve-image-digests resolves public image digest
        id: resolve-digests
        uses: ./resolve-image-digests
        with:
          version: latest
          registry: index.docker.io
          images: |
            busybox=library/busybox

      - name: Assert resolved digest output
        run: |
          yaml="${{ steps.resolve-digests.outputs.images-yaml }}"
          echo "$yaml"
          echo "$yaml" | grep -q -- '- name: busybox'
          echo "$yaml" | grep -q 'newName: index.docker.io/library/busybox'
          echo "$yaml" | grep -q 'newTag: latest@sha256:'

      - name: secrets-to-kustomize-env action must exist
        run: test -f secrets-to-kustomize-env/action.yml

      - name: render-kustomize action must exist
        run: test -f render-kustomize/action.yml

      - name: secrets-to-kustomize-env writes prefixed secrets only
        uses: ./secrets-to-kustomize-env
        with:
          secrets-json: '{"KUBESECRET_FROM_ACTION":"action-value","OTHER_SECRET":"must-not-appear"}'
          prefix: KUBESECRET_
          output-file: tests/fixtures/overlays/test/test.secret.env

      - name: Assert env file contents
        run: |
          cat tests/fixtures/overlays/test/test.secret.env
          grep -q '^FROM_ACTION=action-value$' tests/fixtures/overlays/test/test.secret.env
          ! grep -q 'OTHER_SECRET\|must-not-appear' tests/fixtures/overlays/test/test.secret.env

      - name: render-kustomize builds overlay
        uses: ./render-kustomize
        with:
          overlay-path: tests/fixtures/overlays/test
          secret-name: bastilia-rating-secret
          secret-env-file: tests/fixtures/overlays/test/test.secret.env
          images-yaml: |
            - name: bastilia-rating
              newName: cr.selcloud.ru/joinrpg/bastilia-rating
              newTag: 1.0.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Assert rendered manifests
        run: |
          ls kustomize_output
          grep -rq 'cr.selcloud.ru/joinrpg/bastilia-rating:1.0.0@sha256:aaaa' kustomize_output
          grep -rq 'YWN0aW9uLXZhbHVl' kustomize_output
