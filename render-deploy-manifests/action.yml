name: Render deploy manifests
description: >-
  Готовит манифесты окружения к деплою: пишет GitHub-секреты с префиксом
  (по умолчанию KUBESECRET_, префикс отбрасывается) в .env-файл окружения,
  дописывает в kustomization secretGenerator (behavior: replace) и блок images
  из images-yaml, затем рендерит манифесты в каталог kustomize_output/
  (по файлу на ресурс).

inputs:
  overlay-path:
    description: Путь к директории kustomize-оверлея окружения.
    required: true
  secret-name:
    description: >-
      Имя k8s-Secret в secretGenerator (совпадает с secretRef в манифестах).
      .env-файл пишется в <overlay-path>/<secret-name>.env.
    required: true
  secrets-json:
    description: Все секреты одним JSON — вызывающий workflow передаёт toJSON(secrets).
    required: true
  prefix:
    description: Префикс секретов, которые попадут в k8s-Secret.
    required: false
    default: KUBESECRET_
  images-yaml:
    description: 'Блок images: в формате kustomization (выход resolve-image-digests).'
    required: true

runs:
  using: composite
  steps:
    - name: Write secrets to env file
      shell: bash
      env:
        SECRETS_JSON: ${{ inputs.secrets-json }}
        PREFIX: ${{ inputs.prefix }}
        OUTPUT_FILE: ${{ inputs.overlay-path }}/${{ inputs.secret-name }}.env
      run: |
        set -euo pipefail

        # Многострочные значения (PEM-ключи, сертификаты) формат env-файла не
        # поддерживает: вторая строка стала бы отдельным ключом, секрет обрезался
        # бы до первой строки, а деплой прошёл бы «успешно». Лучше упасть здесь.
        multiline=$(echo "$SECRETS_JSON" | jq -r --arg prefix "$PREFIX" '
          to_entries[]
          | select(.key | startswith($prefix))
          | select(.value | tostring | contains("\n"))
          | .key')
        if [ -n "$multiline" ]; then
          echo "::error::Секреты с многострочными значениями не поддерживаются env-форматом: $(echo "$multiline" | tr '\n' ' ')" >&2
          exit 1
        fi

        echo "$SECRETS_JSON" | jq -r --arg prefix "$PREFIX" '
          to_entries[]
          | select(.key | startswith($prefix))
          | "\(.key | ltrimstr($prefix))=\(.value)"' > "$OUTPUT_FILE"

        count=$(grep -c . "$OUTPUT_FILE" || true)
        echo "Wrote $count secret(s) with prefix $PREFIX to $OUTPUT_FILE"

    - name: Append secretGenerator and images to kustomization
      shell: bash
      env:
        KUSTOMIZATION: ${{ inputs.overlay-path }}/kustomization.yaml
        SECRET_NAME: ${{ inputs.secret-name }}
      run: |
        set -euo pipefail

        # Дубликат YAML-ключа kustomize не отклоняет — он молча берёт последний,
        # и наш блок (дайджесты образов) выбрасывается. Падём явно.
        if grep -qE '^images:' "$KUSTOMIZATION"; then
          echo "::error::В $KUSTOMIZATION уже есть ключ images: — уберите его из оверлея, images подставляет render-deploy-manifests" >&2
          exit 1
        fi
        if grep -qxF -- "- name: ${SECRET_NAME}" "$KUSTOMIZATION" || grep -qxF -- "  name: ${SECRET_NAME}" "$KUSTOMIZATION"; then
          echo "::error::В $KUSTOMIZATION уже есть генератор с именем ${SECRET_NAME} — дубликат не применится" >&2
          exit 1
        fi

        {
          echo ""
          echo "secretGenerator:"
          echo "- name: ${{ inputs.secret-name }}"
          echo "  envs:"
          echo "  - ${{ inputs.secret-name }}.env"
          echo "  behavior: replace"
          echo ""
          echo "images:"
          echo '${{ inputs.images-yaml }}'
        } >> "$KUSTOMIZATION"

    - name: kubectl kustomize
      shell: bash
      run: |
        set -euo pipefail
        # Каталог должен существовать до генерации: kustomize пишет по файлу на ресурс.
        mkdir -p kustomize_output
        kubectl kustomize '${{ inputs.overlay-path }}' -o kustomize_output
