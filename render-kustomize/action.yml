name: Render kustomize manifests
description: >-
  Дописывает в kustomization окружения secretGenerator (behavior: replace) из
  .env-файла секретов и блок images из images-yaml (выход resolve-image-digests),
  затем рендерит манифесты в каталог kustomize_output/ (по файлу на ресурс).

inputs:
  overlay-path:
    description: Путь к директории kustomize-оверлея окружения.
    required: true
  secret-name:
    description: Имя k8s-Secret в secretGenerator (совпадает с secretRef в манифестах).
    required: true
  secret-env-file:
    description: Путь к .env-файлу с секретами (пишется secrets-to-kustomize-env).
    required: true
  images-yaml:
    description: 'Блок images: в формате kustomization (выход resolve-image-digests).'
    required: true

runs:
  using: composite
  steps:
    - name: Append secretGenerator and images to kustomization
      shell: bash
      run: |
        set -euo pipefail

        env_basename=$(basename '${{ inputs.secret-env-file }}')

        {
          echo ""
          echo "secretGenerator:"
          echo "- name: ${{ inputs.secret-name }}"
          echo "  envs:"
          echo "  - ${env_basename}"
          echo "  behavior: replace"
          echo ""
          echo "images:"
          echo '${{ inputs.images-yaml }}'
        } >> '${{ inputs.overlay-path }}/kustomization.yaml'

    - name: kubectl kustomize
      shell: bash
      run: |
        set -euo pipefail
        # Каталог должен существовать до генерации: kustomize пишет по файлу на ресурс.
        mkdir -p kustomize_output
        kubectl kustomize '${{ inputs.overlay-path }}' -o kustomize_output
